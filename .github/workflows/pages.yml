name: Publish Reader

# 把网页阅读器发布到 GitHub Pages。
# 启用方法：仓库 Settings → Pages → Source 选择 "GitHub Actions"，
# 再在 Settings → Secrets and variables → Actions → Variables 中新建 ENABLE_PAGES=true。
# 未启用前，推送不会触发发布，也就不会因为 Pages 未开启而报错；也可以在 Actions 页手动运行。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/kb.py check && python3 tools/kb.py index --check
      - run: python3 tools/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
