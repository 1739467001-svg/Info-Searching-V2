name: KB Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 工具自测
        run: python3 -m unittest discover -s tools/tests -v
      - name: 条目校验（规范即代码）
        run: python3 tools/kb.py check
      - name: 派生文件是否最新
        run: python3 tools/kb.py index --check
